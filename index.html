<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>World Boss Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>World Boss Dashboard</h1>
      <span class="status" id="status">Loading...</span>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Next WB</h2>
        <div class="value" id="nextWBDate">--</div>
        <div class="countdown" id="countdown">--</div>
      </section>

      <section class="card wide">
        <h2>Future predictions</h2>
        <div id="futureContainer"></div>
      </section>
    </main>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
